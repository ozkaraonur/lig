version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Ana sürüm yükseltmeleri planlı iş olarak elle yapılır (docs/DECISIONS.md, K-003).
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Fastify, NestJS'in beklediği sürüme sabit; NestJS ile birlikte yükseltilir (K-004).
      - dependency-name: fastify
      # @nestjs/* paketleri Fastify sürümüyle birlikte elle yükseltilir: tek başına yama bile iki Fastify kopyasına
      # ve tip hatasına yol açabiliyor (11.2.6 denemesi, K-004).
      - dependency-name: '@nestjs/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
